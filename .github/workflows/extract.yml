name: Extract Subtitles Cloud

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط التحميل (Nyaa, Torrent, Magnet, Drive, MEGA folder/file, Mediafire, Pixeldrain, MiteDrive, DDL directory/file)'
        required: true
      name:
        description: 'اسم العمل / الموسم'
        required: true
        default: 'Anime_Subtitles'
      chat_id:
        description: 'معرف محادثة تليجرام لإرسال الملف إليه (اختياري)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space (Free up ~75GB)
        run: |
          echo "=== 🧹 Cleaning unused pre-installed packages to maximize free space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm || true
          sudo docker image prune -a --force || true
          echo "=== 💾 Available Disk Space ==="
          df -h /

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools (MKVToolNix, Aria2, Megatools, Gdown, 7-Zip, Unar, Node dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2 megatools p7zip-full unar unrar-free zip
          pip install --no-cache-dir --upgrade mega.py gdown
          npm install

      - name: Turbo Download & Extract Subtitles
        run: |
          node src/extract.mjs "${{ inputs.url }}" "${{ inputs.name }}"

      - name: Package Subtitles & Fonts (Auto-Split if > 45MB)
        run: |
          SAFE_NAME=$(python3 -c "import re; print(re.sub(r'[\\\\/:*?\"<>|]', '_', '''${{ inputs.name }}''').strip() or 'Subtitles')")
          echo "SAFE_NAME=${SAFE_NAME}" >> $GITHUB_ENV

          cd extracted_subtitles
          zip -r "../${SAFE_NAME}.zip" .
          cd ..

          ZIP_SIZE=$(stat -c%s "${SAFE_NAME}.zip" 2>/dev/null || stat -f%z "${SAFE_NAME}.zip" 2>/dev/null || wc -c < "${SAFE_NAME}.zip")
          echo "ZIP size: ${ZIP_SIZE} bytes"

          if [ "$ZIP_SIZE" -gt 47185920 ]; then
            echo "⚠️ File exceeds 45MB. Splitting into 45MB parts for Telegram compatibility..."
            7z a -v45m -mx=9 "${SAFE_NAME}.7z" ./extracted_subtitles/*
            echo "IS_SPLIT=true" >> $GITHUB_ENV
          else
            echo "IS_SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Send Subtitles to Telegram
        if: inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "⚠️ TELEGRAM_BOT_TOKEN is not configured in repository secrets. Skipping Telegram delivery."
            exit 0
          fi

          if [ "$IS_SPLIT" = "true" ]; then
            PARTS=($(ls -1 "${SAFE_NAME}".7z.* 2>/dev/null | sort))
            TOTAL=${#PARTS[@]}
            echo "📤 Sending ${TOTAL} split parts to Telegram chat ${{ inputs.chat_id }}..."

            INDEX=1
            for PART in "${PARTS[@]}"; do
              echo "Sending part ${INDEX}/${TOTAL}: ${PART}..."
              curl -s -F chat_id="${{ inputs.chat_id }}" \
                   -F document=@"${PART}" \
                   -F caption="🎬 الترجمات والخطوط (الجزء ${INDEX} من ${TOTAL})%0A📌 العمل: ${{ inputs.name }}" \
                   https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
              INDEX=$((INDEX + 1))
              sleep 1
            done
          else
            if [ -f "${SAFE_NAME}.zip" ]; then
              echo "📤 Sending ${SAFE_NAME}.zip to Telegram chat ${{ inputs.chat_id }}..."
              curl -s -F chat_id="${{ inputs.chat_id }}" \
                   -F document=@"${SAFE_NAME}.zip" \
                   -F caption="🎬 تم استخراج ملفات الترجمة والخطوط بنجاح!%0A📌 العمل: ${{ inputs.name }}" \
                   https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
            fi
          fi

      - name: Notify Failure to Telegram
        if: failure() && inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -F chat_id="${{ inputs.chat_id }}" \
                 -F text="❌ عذراً، فشل استخراج الترجمات للعمل: ${{ inputs.name }}.%0Aتأكد من صلاحية الرابط وأنه يحتوي على ملفات ترجمة صالحة." \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
          fi

      - name: Upload Clean Subtitles Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.name }}"
          path: extracted_subtitles/
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🎬 تم استخراج ملفات الترجمة والخطوط بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "- **العمل:** \`${{ inputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "يمكنك تنزيل الملف النظيف مباشرة من قسم **Artifacts** في الأعلى." >> $GITHUB_STEP_SUMMARY