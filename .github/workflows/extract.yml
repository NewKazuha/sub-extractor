name: Extract Subtitles Cloud

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط التحميل (Nyaa, Torrent, Magnet, Drive, MEGA folder/file, Mediafire, Pixeldrain, MiteDrive, DDL directory/file)'
        required: true
      name:
        description: 'اسم العمل / الموسم'
        required: true
        default: 'Anime_Subtitles'
      chat_id:
        description: 'معرف محادثة تليجرام لإرسال الملف إليه (اختياري)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space (Fast & Background Cleanup)
        run: |
          echo "=== 🧹 Instant fast cleanup of bulky tools ==="
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm || true

          echo "=== 🚀 Launching deep cleanup (Android SDK & Docker) in background ==="
          nohup bash -c '
            sudo rm -rf /usr/local/lib/android || true
            sudo docker image prune -a --force || true
          ' > /dev/null 2>&1 < /dev/null &

          echo "=== 💾 Free Space Available Now ==="
          df -h /

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools (MKVToolNix, Aria2, Megatools, Gdown, 7-Zip, Unar, Node dependencies)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mkvtoolnix aria2 megatools p7zip-full unar unrar-free zip
          pip install --no-cache-dir --upgrade mega.py gdown
          npm install

      - name: Turbo Download & Extract Subtitles
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
        run: |
          node src/extract.mjs "$INPUT_URL" "$INPUT_NAME"

      - name: Package Subtitles & Send to Telegram
        env:
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANIME_NAME: ${{ inputs.name }}
        run: |
          python3 src/package_and_send.py

      - name: Notify Failure to Telegram
        if: failure() && inputs.chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          ANIME_NAME: ${{ inputs.name }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "text=❌ عذراً، فشل استخراج الترجمات للعمل: ${ANIME_NAME}.
تأكد من صلاحية الرابط وأنه يحتوي على ملفات ترجمة صالحة." \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
          fi

      - name: Prepare Safe Artifact Name
        id: prep
        if: always()
        env:
          RAW_NAME: ${{ inputs.name }}
        run: |
          SAFE_NAME=$(python3 -c "import os, re; print(re.sub(r'[\/:*?\"<>|\\\\\r\n]', '_', os.environ.get('RAW_NAME', '')).strip() or 'Anime_Subtitles')")
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Clean Subtitles Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: "${{ steps.prep.outputs.safe_name }}"
          path: extracted_subtitles/
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          ANIME_NAME: ${{ inputs.name }}
        run: |
          echo "### 🎬 تم استخراج ملفات الترجمة والخطوط بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "- **العمل:** \`${ANIME_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "يمكنك تنزيل الملف النظيف مباشرة من قسم **Artifacts** في الأعلى." >> $GITHUB_STEP_SUMMARY